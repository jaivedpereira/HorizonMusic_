workflows:
  android-build:
    name: Android APK Build
    instance_type: mac_mini_m1
    max_build_duration: 60
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
    scripts:
      - name: Instalar Gradle 9.3.1 e Compilar
        script: |
          curl -OL https://services.gradle.org/distributions/gradle-9.3.1-bin.zip
          unzip -q gradle-9.3.1-bin.zip
          export PATH=$PWD/gradle-9.3.1/bin:$PATH
          gradle assembleRelease
    artifacts:
      - app/build/outputs/apk/release/*.apk
      
